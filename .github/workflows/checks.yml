name: Yami checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Lines, UI rules, Biome, secrets, types, native build and tests.
      - run: npm run check
      - run: npm run build
      - run: npm run docs
      - run: git diff --exit-code -- docs/internal/viewer
      # Known advisories are reported here; updates wait two weeks (see
      # docs/internal/security-and-providers.md), so this does not fail the run.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
